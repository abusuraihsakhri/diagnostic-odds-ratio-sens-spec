version: '3.8'

services:
  diagnostic-odds-ratio-sens-spec:
    build: .
    container_name: diagnostic-odds-ratio-sens-spec
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=diagnostic-odds-ratio-sens-spec-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
