name: Deploy browser calculator

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed application and scripts
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          curl --retry 8 --retry-delay 5 --retry-all-errors -fLsS "$root/" -o /tmp/pages-index.html
          grep -q "Diagnostic test performance" /tmp/pages-index.html
          curl --retry 8 --retry-delay 5 --retry-all-errors -fLsS "$root/metrics.js" -o /tmp/metrics.js
          curl --retry 8 --retry-delay 5 --retry-all-errors -fLsS "$root/app.js" -o /tmp/app.js
          node --check /tmp/metrics.js
          node --check /tmp/app.js
