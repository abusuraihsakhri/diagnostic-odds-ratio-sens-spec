name: Python tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q agents cli.py dor_youden.py dor_enrichment.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify audit security
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          ledger = AuditTrail(secret_key="test-only-key")
          ledger.log("test", "worker", "CHECK", {"status": "ok"})
          assert ledger.verify_integrity()
          ledger.logs[0]["current_hash"] = "0" * 64
          assert not ledger.verify_integrity()
          PY
